<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Collector - NFT Position Fixed</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        #score-ui { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 36px; font-weight: bold; z-index: 100; text-shadow: 0 0 15px rgba(0,255,204,0.6); pointer-events: none; }
        #win-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; backdrop-filter: blur(10px); }
        .win-content { padding: 30px; border: 2px solid #00ffcc; border-radius: 20px; background: rgba(0, 255, 204, 0.1); }
        .arjs-loader { height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: rgba(0, 0, 0, 0.9); z-index: 9998; display: flex; justify-content: center; align-items: center; }
        .arjs-loader div { text-align: center; font-size: 1.25em; color: #00ffcc; }
        button { padding: 18px 50px; font-size: 18px; background: #00ffcc; border: none; border-radius: 40px; color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>

<body>
    <div class="arjs-loader" id="loader">
        <div>正在加载海报特征点...<br><small style="color:#888">请确保网络通畅</small></div>
    </div>

    <div id="overlay">
        <h1>AR 采集挑战</h1>
        <p style="color: #888; margin-bottom: 20px;">扫描完整海报开始游戏</p>
        <button id="start-btn">开始游戏</button>
    </div>

    <div id="score-ui">0</div>

    <div id="win-screen">
        <div class="win-content">
            <h2>🎉 挑战成功！</h2>
            <p>恭喜获得纤体瓶奖励</p>
            <button onclick="location.reload()">再玩一次</button>
        </div>
    </div>

    <a-scene 
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; precision: medium; colorManagement: true;"
        embedded 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets timeout="180000">
            <a-asset-item id="cup-m" src="cup-v6.glb"></a-asset-item>
            <a-asset-item id="apple-m" src="apple-v2.glb"></a-asset-item>
            <a-asset-item id="kale-m" src="kale-v3.glb"></a-asset-item>
            <a-asset-item id="kugua-m" src="kugua-v4.glb"></a-asset-item>
            <a-asset-item id="lemon-m" src="lemon-v5.glb"></a-asset-item>
        </a-assets>

        <a-nft
            id="game-marker"
            type="nft"
            url="./poster_nft" 
            smooth="true"
            smoothCount="10"
            smoothTolerance=".01"
            smoothThreshold="5">

            <!-- 环境光增强 -->
            <a-entity light="type: ambient; intensity: 1.5;"></a-entity>
            <a-entity light="type: directional; position: 0 10 10; intensity: 1;"></a-entity>

            <!-- 
                【关键调整说明】：
                1. scale 大幅增加：NFT 模式下 0.3 太小了，这里增加到 50-80。
                2. position 重新校准：NFT 原点在左下角。这里将 Y 设为正数，把模型推向海报中心。
                3. rotation：保持 270 0 0。
            -->
            <a-entity id="player-cup" 
                      gltf-model="#cup-m" 
                      scale="60 60 60" 
                      position="150 250 -150" 
                      rotation="270 0 0">
            </a-entity>

            <a-entity id="drop-zone"></a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let score = 0;
        let cupX = 150; // 对应初始 position 的第一个值
        let isStarted = false;
        let gameActive = true;
        let spawnInterval;

        const player = document.querySelector('#player-cup');
        const dropZone = document.querySelector('#drop-zone');
        const marker = document.querySelector('#game-marker');
        const loader = document.getElementById('loader');
        const models = ['#apple-m', '#kale-m', '#kugua-m', '#lemon-m'];

        window.addEventListener('arjs-nft-loaded', () => {
            loader.style.display = 'none';
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            document.getElementById('overlay').style.display = 'none';
            isStarted = true;
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
            startGameLoop();
        });

        window.addEventListener('deviceorientation', (e) => {
            if(!isStarted || !gameActive || !marker.getAttribute('visible')) return;
            let tilt = e.gamma; 
            if(Math.abs(tilt) > 2) {
                // 加大移动步长 (5.0)，因为像素坐标系很大
                cupX += tilt * 5.0; 
                // 限制在海报范围：假定海报逻辑宽度在 0 - 300 左右
                cupX = Math.max(-50, Math.min(350, cupX)); 
                player.setAttribute('position', `${cupX} 250 -150`);
            }
        });

        function startGameLoop() {
            spawnInterval = setInterval(() => {
                if (gameActive && marker.getAttribute('visible')) {
                    createFruit();
                }
            }, 1800);
        }

        function checkWin() {
            if (score >= 200) {
                gameActive = false;
                clearInterval(spawnInterval);
                document.getElementById('win-screen').style.display = 'flex';
            }
        }

        function createFruit() {
            if (dropZone.children.length > 8) return;

            const fruit = document.createElement('a-entity');
            const randomModel = models[Math.floor(Math.random() * models.length)];
            
            // 随机生成位置配合像素坐标系
            let xPos = (Math.random() * 300); 
            let zPos = -1200; // 从远处滑向近处
            let yPos = 250; 

            fruit.setAttribute('gltf-model', randomModel);
            fruit.setAttribute('scale', '40 40 40');
            fruit.setAttribute('rotation', '90 0 0');
            fruit.setAttribute('position', `${xPos} ${yPos} ${zPos}`);
            dropZone.appendChild(fruit);

            const fallTick = setInterval(() => {
                if (!gameActive) {
                    clearInterval(fallTick);
                    fruit.remove();
                    return;
                }

                zPos += 18; 
                fruit.setAttribute('position', `${xPos} ${yPos} ${zPos}`);

                // 碰撞判定范围同步扩大
                if (zPos > -200 && zPos < 50 && Math.abs(xPos - cupX) < 80) {
                    score += 10;
                    document.getElementById('score-ui').innerText = score;
                    clearInterval(fallTick);
                    fruit.remove();
                    checkWin();
                }

                if (zPos > 300) {
                    clearInterval(fallTick);
                    if(fruit.parentNode) fruit.parentNode.removeChild(fruit);
                }
            }, 25);
        }
    </script>
</body>
</html>
