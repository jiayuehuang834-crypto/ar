<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR互动领奖游戏</title>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mind-ar-image-three.prod.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; text-shadow: 1px 1px 2px black; z-index: 10; }
        #score { font-size: 24px; font-weight: bold; }
        #win-screen {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); color: white; flex-direction: column;
            justify-content: center; align-items: center; z-index: 20;
        }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #ffcc00; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="ui">
        <div>分数: <span id="score">0</span> / 200</div>
    </div>

    <div id="win-screen">
        <h1>🎉 挑战成功！</h1>
        <p>物理奖励已发放，请在出料口领取</p>
        <button onclick="location.reload()">再玩一次</button>
    </div>

    <script type="module">
        const THREE = window.MINDAR.IMAGE.THREE;
        let score = 0;
        let gameActive = false;
        const targetScore = 200;

        // --- 1. 初始化 MindAR ---
        const mindarThree = new THREE.MindARThree({
            container: document.body,
            imageTargetSrc: './targets.mind', // 确保你的 .mind 文件路径正确
        });
        const {renderer, scene, camera} = mindarThree;

        // 添加灯光
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        scene.add(light);

        // --- 2. 设置追踪目标 ---
        const anchor = mindarThree.addAnchor(0);
        
        // 创建一个简单的篮子模型 (代替你未来的 .glb 文件)
        const basketGeometry = new THREE.BoxGeometry(0.3, 0.1, 0.3);
        const basketMaterial = new THREE.MeshBasicMaterial({color: 0x00ff00, transparent: true, opacity: 0.5});
        const basket = new THREE.Mesh(basketGeometry, basketMaterial);
        anchor.group.add(basket);

        // --- 3. 游戏核心逻辑：触发物理电机 ---
        function triggerPhysicalMotor() {
            console.log("正在尝试触发物理装置...");
            
            // 【关键】填入你之前测试成功的本地 IP 地址
            const serverUrl = 'http://10.136.12.40:3000/win';

            fetch(serverUrl)
                .then(response => {
                    if (response.ok) {
                        console.log("✅ 成功发送指令到本地服务器");
                    }
                })
                .catch(err => {
                    console.error("❌ 无法连接到本地服务器，请检查 WiFi 或 IP:", err);
                    alert("连接本地设备失败，请确保电脑端 Node.js 已启动！");
                });
        }

        function checkWin() {
            if (score >= targetScore && !gameActive === false) {
                gameActive = false; // 停止游戏
                document.getElementById('win-screen').style.display = 'flex';
                
                // 执行物理联动
                triggerPhysicalMotor();
            }
        }

        // --- 4. 模拟得分过程 (实际开发中请替换为你捕获物体的逻辑) ---
        // 这里为了演示，点击屏幕即加分
        window.addEventListener('click', () => {
            if (score < targetScore) {
                score += 50;
                document.getElementById('score').innerText = score;
                checkWin();
            }
        });

        // --- 5. 启动 AR ---
        const start = async() => {
            await mindarThree.start();
            renderer.setAnimationLoop(() => {
                renderer.render(scene, camera);
            });
        }
        start();
    </script>
</body>
</html>
