<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Collector - Mega Bottle & Smooth Motion</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background-color: #000; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; }
        #score-ui { position: fixed; top: 40px; left: 50%; transform: translateX(-50%); color: #00ffcc; font-size: 36px; font-weight: bold; z-index: 100; text-shadow: 0 0 15px rgba(0,255,204,0.6); pointer-events: none; }
        #win-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 10000; display: none; flex-direction: column; justify-content: center; align-items: center; color: #fff; text-align: center; backdrop-filter: blur(15px); }
        .win-content { padding: 40px; border: 3px solid #00ffcc; border-radius: 30px; background: rgba(0, 255, 204, 0.1); box-shadow: 0 0 50px rgba(0, 255, 204, 0.2); }
        .arjs-loader { height: 100%; width: 100%; position: absolute; top: 0; left: 0; background-color: rgba(0, 0, 0, 0.9); z-index: 9998; display: flex; justify-content: center; align-items: center; }
        .arjs-loader div { text-align: center; font-size: 1.25em; color: #00ffcc; letter-spacing: 1px; }
        button { padding: 20px 60px; font-size: 20px; background: #00ffcc; border: none; border-radius: 50px; color: #000; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:active { transform: scale(0.95); }
    </style>
</head>

<body>
    <div class="arjs-loader" id="loader">
        <div>正在深度扫描海报特征...<br><small style="color:#666">请保持环境光线明亮</small></div>
    </div>

    <div id="overlay">
        <h1 style="letter-spacing: 2px;">AR 采集挑战</h1>
        <p style="color: #aaa; margin-bottom: 30px;">对准海报，收集纯净能量</p>
        <button id="start-btn">开启体验</button>
    </div>

    <div id="score-ui">0</div>

    <div id="win-screen">
        <div class="win-content">
            <h2 style="font-size: 32px; color: #00ffcc;">挑战圆满成功</h2>
            <p style="font-size: 20px; line-height: 1.8;">能量已注满纤体瓶<br><strong style="font-size: 26px; color: #fff;">恭喜获得纤体瓶奖励</strong></p>
            <button onclick="location.reload()" style="margin-top: 20px;">再次挑战</button>
        </div>
    </div>

    <a-scene 
        vr-mode-ui="enabled: false;"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true;"
        embedded 
        arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
        
        <a-assets timeout="180000">
            <a-asset-item id="cup-m" src="cup-v6.glb"></a-asset-item>
            <a-asset-item id="apple-m" src="apple-v2.glb"></a-asset-item>
            <a-asset-item id="kale-m" src="kale-v3.glb"></a-asset-item>
            <a-asset-item id="kugua-m" src="kugua-v4.glb"></a-asset-item>
            <a-asset-item id="lemon-m" src="lemon-v5.glb"></a-asset-item>
        </a-assets>

        <a-nft
            id="game-marker"
            type="nft"
            url="./poster_nft" 
            smooth="true"
            smoothCount="12"
            smoothTolerance=".01"
            smoothThreshold="5">

            <a-entity light="type: ambient; intensity: 1.6;"></a-entity>
            <a-entity light="type: directional; position: 0 10 10; intensity: 1.2;"></a-entity>

            <!-- 
                【优化点】：
                1. scale 增加到 150 (巨型瓶子)
                2. position Y 保持 450 (高位显示)
            -->
            <a-entity id="player-cup" 
                      gltf-model="#cup-m" 
                      scale="150 150 150" 
                      position="150 450 -150" 
                      rotation="270 0 0">
            </a-entity>

            <a-entity id="drop-zone"></a-entity>
        </a-nft>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let score = 0;
        let cupX = 150; 
        let isStarted = false;
        let gameActive = true;
        let spawnInterval;

        const player = document.querySelector('#player-cup');
        const dropZone = document.querySelector('#drop-zone');
        const marker = document.querySelector('#game-marker');
        const loader = document.getElementById('loader');
        const models = ['#apple-m', '#kale-m', '#kugua-m', '#lemon-m'];

        window.addEventListener('arjs-nft-loaded', () => {
            loader.style.display = 'none';
        });

        document.getElementById('start-btn').addEventListener('click', function() {
            document.getElementById('overlay').style.display = 'none';
            isStarted = true;
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
            startGameLoop();
        });

        window.addEventListener('deviceorientation', (e) => {
            if(!isStarted || !gameActive || !marker.getAttribute('visible')) return;
            let tilt = e.gamma; 
            if(Math.abs(tilt) > 2) {
                // 【手感调优】：降低灵敏度系数至 3.5 (原为 6.0)，移动更稳健
                cupX += tilt * 3.5; 
                // 增加边界范围以适配大瓶子
                cupX = Math.max(-150, Math.min(450, cupX)); 
                player.setAttribute('position', `${cupX} 450 -150`);
            }
        });

        function startGameLoop() {
            spawnInterval = setInterval(() => {
                if (gameActive && marker.getAttribute('visible')) {
                    createFruit();
                }
            }, 1800);
        }

        function checkWin() {
            if (score >= 200) {
                gameActive = false;
                clearInterval(spawnInterval);
                document.getElementById('win-screen').style.display = 'flex';
            }
        }

        function createFruit() {
            if (dropZone.children.length > 8) return;

            const fruit = document.createElement('a-entity');
            const randomModel = models[Math.floor(Math.random() * models.length)];
            
            // 拓宽随机掉落的 X 轴范围以匹配大瓶子移动范围
            let xPos = (Math.random() * 500 - 100); 
            let zPos = -1600; 
            let yPos = 450; 

            fruit.setAttribute('gltf-model', randomModel);
            fruit.setAttribute('scale', '85 85 85'); // 同步放大蔬果体积
            fruit.setAttribute('rotation', '90 0 0');
            fruit.setAttribute('position', `${xPos} ${yPos} ${zPos}`);
            dropZone.appendChild(fruit);

            const fallTick = setInterval(() => {
                if (!gameActive) {
                    clearInterval(fallTick);
                    fruit.remove();
                    return;
                }

                zPos += 24; 
                fruit.setAttribute('position', `${xPos} ${yPos} ${zPos}`);

                // 【碰撞判定优化】：半径扩大到 160，适配瓶子体积
                if (zPos > -200 && zPos < 150 && Math.abs(xPos - cupX) < 160) {
                    score += 10;
                    document.getElementById('score-ui').innerText = score;
                    clearInterval(fallTick);
                    fruit.remove();
                    checkWin();
                }

                if (zPos > 500) {
                    clearInterval(fallTick);
                    if(fruit.parentNode) fruit.parentNode.removeChild(fruit);
                }
            }, 25);
        }
    </script>
</body>
</html>
